  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #e7ebe7; /* --bg: pale void-deck concrete */
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  .display { font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-weight: 700; }

  .top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding-top: 41px;
    color: #0a6a72; /* --accent */
  }
  .top svg { width: 67px; height: 67px; }
  .top .wm { font-size: 60px; line-height: 1; }

  .boardcard {
    margin: 31px 84px 0;
    background: #ffffff; /* --surface */
    border: 2px solid #c4d0c8; /* --border */
    border-radius: 6px; /* 4px world, scaled with the card */
    flex: 1;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }
  .svc-cell {
    background: #0a6a72;
    color: #ffffff; /* --on-accent */
    width: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .svc-cell .no { font-size: 150px; line-height: 1; font-variant-numeric: tabular-nums; }
  .etas { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .eta {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 17px;
    border-left: 2px solid #c4d0c8;
  }
  .eta .v { font-weight: 700; font-size: 126px; line-height: 1; color: #1d2523; font-variant-numeric: tabular-nums; }
  .eta.now .v { color: #0a6a72; }
  .eta .u { font-size: 28px; color: #5b6663; min-height: 28px; }
  .dot { width: 24px; height: 24px; border-radius: 50%; }

  /* A course of the mosaic the accent was sampled from, flush to the bottom edge.
     Kept slim — at full height it pulled the eye off the board. */
  .tiles { display: flex; gap: 4px; margin-top: 36px; }
  .tiles i { flex: 1; height: 20px; background: #0a6a72; }
  .tiles i:nth-child(3n) { background: #0b727b; }
